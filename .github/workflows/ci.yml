name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Builds the application and runs all tests; GitHub-hosted runners have Docker, so Testcontainers
      # starts a real PostgreSQL. Tests never call the Riot API, so no API key is needed.
      - name: Build and test
        run: ./mvnw -B verify

# Local development: `docker compose up -d postgres` and run the application from the IDE or with Maven.
# Everything in containers: `docker compose up --build` (values come from the .env file next to this one).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-tftmetahub}
      POSTGRES_USER: ${DB_USERNAME:-tftmetahub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tftmetahub}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        # Flyway migrates the schema at startup, so the database must already accept connections
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-tftmetahub}
      DB_USERNAME: ${DB_USERNAME:-tftmetahub}
      DB_PASSWORD: ${DB_PASSWORD:-tftmetahub}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      # The application refuses to start without admin credentials (validated AdminProperties)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data:

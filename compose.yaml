services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-tftmetahub}
      POSTGRES_USER: ${DB_USERNAME:-tftmetahub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tftmetahub}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container page">
    <h1>Admin panel</h1>

    <p th:if="${successMessage}" th:text="${successMessage}" class="alert alert--success"></p>
    <p th:if="${errorMessage}" th:text="${errorMessage}" class="alert alert--error"></p>

    <section class="card">
        <div class="card__header">
            <h2>Tier lists</h2>
            <a th:href="@{/admin/tierlists/new}" class="button">New tier list</a>
        </div>
        <p th:if="${#lists.isEmpty(tierLists)}" class="muted">No tier lists yet.</p>
        <table th:unless="${#lists.isEmpty(tierLists)}" class="table">
            <thead>
            <tr>
                <th>Title</th>
                <th>Patch</th>
                <th>Set</th>
                <th>Status</th>
                <th>Compositions</th>
                <th>Updated</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tierList : ${tierLists}">
                <td><a th:href="@{/admin/tierlists/{id}(id=${tierList.id})}" th:text="${tierList.title}">Title</a></td>
                <td th:text="${tierList.patch}">16.3</td>
                <td th:text="${tierList.setNumber}">16</td>
                <td><span th:text="${tierList.status}" th:class="|badge badge--${#strings.toLowerCase(tierList.status)}|">DRAFT</span></td>
                <td th:text="${tierList.compositionCount}">0</td>
                <td th:text="${#temporals.format(tierList.updatedAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 12:00</td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="card">
        <h2>Game data</h2>
        <p class="muted">
            Downloads champions, traits and items of a set from Community Dragon.
            Importing the same set again updates existing records.
        </p>
        <form th:action="@{/admin/game-data/import}" method="post" class="form form--inline">
            <label for="setNumber">Set number</label>
            <input id="setNumber" name="setNumber" type="number" min="1" max="99" placeholder="e.g. 18" required>
            <button type="submit" class="button">Import set data</button>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

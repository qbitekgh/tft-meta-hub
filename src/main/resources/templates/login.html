<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container page page--narrow">
    <h1>Admin login</h1>

    <p th:if="${param.error}" class="alert alert--error">Invalid username or password.</p>
    <p th:if="${param.logout}" class="alert alert--success">You have been logged out.</p>

    <form th:action="@{/login}" method="post" class="card form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="button">Log in</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

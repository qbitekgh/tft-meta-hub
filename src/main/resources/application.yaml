spring:
  application:
    name: tft-meta-hub
  config:
    # Local development: values from the git-ignored .env file (RIOT_API_KEY, ADMIN_USERNAME, ADMIN_PASSWORD)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tftmetahub}
    username: ${DB_USERNAME:tftmetahub}
    password: ${DB_PASSWORD:tftmetahub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Lazy collections (e.g. units of all compositions) are loaded in batches instead of one query each (N+1)
      hibernate.default_batch_fetch_size: 50

app:
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  cdragon:
    base-url: https://raw.communitydragon.org/latest
    data-path: /cdragon/tft/en_us.json
    assets-base-url: https://raw.communitydragon.org/latest/game/

spring:
  application:
    name: tft-meta-hub
  config:
    # Local development: values from the git-ignored .env file (RIOT_API_KEY, ADMIN_USERNAME, ADMIN_PASSWORD)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tftmetahub}
    username: ${DB_USERNAME:tftmetahub}
    password: ${DB_PASSWORD:tftmetahub}
  web:
    # The UI is in English; dates must not depend on the operating system's language
    locale: en
    locale-resolver: fixed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Lazy collections (e.g. units of all compositions) are loaded in batches instead of one query each (N+1)
      hibernate.default_batch_fetch_size: 50

app:
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  riot:
    api-key: ${RIOT_API_KEY:}
    host-url: https://{host}.api.riotgames.com
    regional-host: europe
    # Development key limits; Riot counts them separately for every routing host
    rate-limits:
      - requests: 20
        window: 1s
      - requests: 100
        window: 2m
    max-attempts: 3
  collector:
    max-matches-per-run: 300
    match-ids-per-player: 20
    retention-days: 14
    # Off by default: a development API key expires every 24 hours
    schedule-enabled: false
    schedule-cron: "0 0 */6 * * *"
  cdragon:
    base-url: https://raw.communitydragon.org/latest
    data-path: /cdragon/tft/en_us.json
    assets-base-url: https://raw.communitydragon.org/latest/game/

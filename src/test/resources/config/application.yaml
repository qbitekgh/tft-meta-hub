# Test-only overrides. Spring Boot reads classpath:/config/application.yaml after classpath:/application.yaml,
# so these values win over the main configuration (and over a local .env file).
app:
  admin:
    username: test-admin
    password: test-password
  riot:
    # Tests never call the real Riot API; without a key the client refuses to send any request.
    api-key: ""
